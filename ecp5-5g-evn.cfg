# OpenOCD config for Lattice ECP5-5G Evaluation Board (LFE5UM5G-85F-EVN)
# Device reports as "ECP5 5G EVN" on macOS

adapter driver ftdi
ftdi device_desc "ECP5 5G EVN"
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
ftdi layout_init 0xfff8 0xfffb
reset_config none

adapter speed 5000

# ECP5-5G 85F
jtag newtap ecp5 tap -irlen 8 -expected-id 0x81113043
